name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src backend scripts main.py train.py

      - name: Run tests
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-smoke-test:
    name: Docker build and API smoke test
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t airpulse:${{ github.sha }} .

      - name: Start container
        run: docker run -d --name airpulse-api -p 8000:8000 airpulse:${{ github.sha }}

      - name: Wait for API and verify prediction
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then
              break
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent \
            -H "Content-Type: application/json" \
            -d '{
              "station_id": "site_113",
              "pm25_at_origin": 97.0,
              "pm25_1h_before": 95.0,
              "pm25_2h_before": 93.0,
              "pm25_23h_before": 88.0,
              "pm25_rolling_mean_3h": 94.0,
              "pm25_rolling_mean_6h": 92.0,
              "pm25_rolling_mean_24h": 90.0,
              "pm25_rolling_observation_count_24h": 24.0,
              "hour": 14,
              "day_of_week": 1,
              "month": 11,
              "hour_sin": 0.5,
              "hour_cos": 0.866,
              "day_of_week_sin": 0.78,
              "day_of_week_cos": 0.62,
              "month_sin": 0.97,
              "month_cos": -0.24
            }' \
            http://127.0.0.1:8000/predict

      - name: Show container logs on failure
        if: failure()
        run: docker logs airpulse-api
